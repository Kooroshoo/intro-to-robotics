<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 50 380 300" width="380" height="300">
  <defs>
    <marker id="ctrlArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="ctrlArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="ctrlArrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- World reference axes at the base -->
  <line x1="100" y1="300" x2="150" y2="300" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ctrlArrowRed)"/>
  <line x1="100" y1="300" x2="100" y2="255" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ctrlArrowBlue)"/>
  <text x="70" y="318" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">{W}</text>

  <!-- Base -->
  <circle cx="100" cy="300" r="5" fill="#333"/>

  <!-- Link 1: base to Joint 1 -->
  <line x1="100" y1="300" x2="165" y2="187.4" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <circle cx="165" cy="187.4" r="6" fill="#333"/>

  <!-- Link 2: Joint 1 to the current end-effector -->
  <line x1="165" y1="187.4" x2="268.4" y2="149.8" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

  <!-- Dashed error vector e, from current end-effector to goal -->
  <line x1="268.4" y1="149.8" x2="320" y2="210" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="285" y="192" font-family="sans-serif" font-size="15" font-weight="bold" fill="#64748b">e</text>

  <!-- Current end-effector pose -->
  <g transform="translate(268.4, 149.8)">
    <circle cx="0" cy="0" r="6" fill="#0d9488"/>
    <path d="M 23.6 18 L 0 18 L 0 -18 L 23.6 -18" fill="none" stroke="#0d9488" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="0" x2="40" y2="0" stroke="#dc2626" stroke-width="2" marker-end="url(#ctrlArrow)"/>
  </g>
  <text x="235" y="120" font-family="sans-serif" font-size="13" fill="#64748b">(x_ee, y_ee, &#952;_ee)</text>

  <!-- Goal end-effector pose (grayed out) -->
  <g transform="translate(320, 210) rotate(35)" opacity="0.4">
    <circle cx="0" cy="0" r="6" fill="#0d9488"/>
    <path d="M 23.6 18 L 0 18 L 0 -18 L 23.6 -18" fill="none" stroke="#0d9488" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="0" x2="40" y2="0" stroke="#dc2626" stroke-width="2" marker-end="url(#ctrlArrow)"/>
  </g>
  <text x="330" y="250" font-family="sans-serif" font-size="13" fill="#64748b">(x_g, y_g, &#952;_g)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 300" width="350" height="300">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Room boundary -->
  <rect x="20" y="20" width="310" height="260" fill="none" stroke="#334155" stroke-width="3"/>

  <!-- Obstacles -->
  <polygon points="90,80 160,70 170,140 100,150" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
  <polygon points="220,150 290,140 300,210 230,220" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>

  <!-- Lidar rays: only hit surfaces with a clear line of sight from the robot -->
  <line x1="175" y1="240" x2="195" y2="20" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="175" y1="240" x2="215" y2="20" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="175" y1="240" x2="20" y2="235" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="175" y1="240" x2="20" y2="270" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="175" y1="240" x2="330" y2="235" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="175" y1="240" x2="175" y2="280" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="175" y1="240" x2="60" y2="280" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="175" y1="240" x2="290" y2="280" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Rays to the obstacles: only their near, robot-facing edges are reachable -->
  <line x1="175" y1="240" x2="105" y2="149" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="175" y1="240" x2="135" y2="145" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="175" y1="240" x2="165" y2="141" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="175" y1="240" x2="222" y2="165" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="175" y1="240" x2="225" y2="195" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="175" y1="240" x2="245" y2="218" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="175" y1="240" x2="265" y2="215" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="175" y1="240" x2="285" y2="212" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Points logged where each ray stops -->
  <circle cx="195" cy="20" r="4" fill="#0d9488"/>
  <circle cx="215" cy="20" r="4" fill="#0d9488"/>
  <circle cx="20" cy="235" r="4" fill="#0d9488"/>
  <circle cx="20" cy="270" r="4" fill="#0d9488"/>
  <circle cx="330" cy="235" r="4" fill="#0d9488"/>
  <circle cx="175" cy="280" r="4" fill="#0d9488"/>
  <circle cx="60" cy="280" r="4" fill="#0d9488"/>
  <circle cx="290" cy="280" r="4" fill="#0d9488"/>

  <circle cx="105" cy="149" r="4" fill="#0d9488"/>
  <circle cx="135" cy="145" r="4" fill="#0d9488"/>
  <circle cx="165" cy="141" r="4" fill="#0d9488"/>
  <circle cx="222" cy="165" r="4" fill="#0d9488"/>
  <circle cx="225" cy="195" r="4" fill="#0d9488"/>
  <circle cx="245" cy="218" r="4" fill="#0d9488"/>
  <circle cx="265" cy="215" r="4" fill="#0d9488"/>
  <circle cx="285" cy="212" r="4" fill="#0d9488"/>

  <!-- Scanning robot -->
  <g transform="translate(175, 240)">
    <rect x="-22" y="-28" width="44" height="8" rx="3" fill="#334155"/>
    <rect x="-22" y="20" width="44" height="8" rx="3" fill="#334155"/>
    <circle cx="0" cy="0" r="24" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="3" fill="#64748b"/>
  </g>
</svg>

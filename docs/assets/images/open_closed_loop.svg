<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="560" height="210">
  <defs>
    <marker id="olArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Open-loop -->
  <text x="20" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Open-Loop</text>

  <rect x="20" y="80" width="80" height="36" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="103" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">Command</text>

  <line x1="100" y1="98" x2="148" y2="98" stroke="#334155" stroke-width="1.5" marker-end="url(#olArrow)"/>

  <rect x="150" y="80" width="80" height="36" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="190" y="103" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">Actuator</text>

  <line x1="230" y1="98" x2="255" y2="98" stroke="#334155" stroke-width="1.5" marker-end="url(#olArrow)"/>

  <text x="20" y="160" font-family="sans-serif" font-size="12" fill="#64748b">No feedback: any disturbance or</text>
  <text x="20" y="176" font-family="sans-serif" font-size="12" fill="#64748b">model error goes uncorrected.</text>

  <!-- Closed-loop -->
  <text x="300" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Closed-Loop</text>

  <rect x="300" y="80" width="80" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="340" y="103" font-family="sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle">Controller</text>

  <line x1="380" y1="98" x2="418" y2="98" stroke="#334155" stroke-width="1.5" marker-end="url(#olArrow)"/>

  <rect x="420" y="80" width="80" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="460" y="103" font-family="sans-serif" font-size="13" fill="#166534" text-anchor="middle">Actuator</text>

  <line x1="500" y1="98" x2="525" y2="98" stroke="#334155" stroke-width="1.5" marker-end="url(#olArrow)"/>

  <!-- Feedback path -->
  <path d="M 528 116 L 528 160 L 340 160 L 340 118" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#olArrow)"/>
  <text x="345" y="150" font-family="sans-serif" font-size="12" fill="#64748b">Sensor feedback</text>

  <text x="300" y="188" font-family="sans-serif" font-size="12" fill="#64748b">Compares actual state to the goal and corrects.</text>
</svg>

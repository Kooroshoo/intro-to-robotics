<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" width="280" height="220">
  <defs>
    <marker id="mrtArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="20" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Mobile Robot</text>
  <text x="20" y="50" font-family="sans-serif" font-size="13" fill="#64748b">Moves its whole body through the world</text>

  <!-- Ghost of an earlier position, to suggest motion -->
  <g transform="translate(75, 165) rotate(-20)" opacity="0.35">
    <rect x="-18" y="-23" width="36" height="7" rx="3" fill="#334155"/>
    <rect x="-18" y="16" width="36" height="7" rx="3" fill="#334155"/>
    <circle cx="0" cy="0" r="20" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Path traveled -->
  <path d="M 75 165 Q 130 150 175 115" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#mrtArrow)"/>

  <!-- Current position -->
  <g transform="translate(190, 105) rotate(-20)">
    <rect x="-22" y="-28" width="44" height="8" rx="3" fill="#334155"/>
    <rect x="-22" y="20" width="44" height="8" rx="3" fill="#334155"/>
    <circle cx="0" cy="0" r="24" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="3" fill="#64748b"/>
  </g>
</svg>

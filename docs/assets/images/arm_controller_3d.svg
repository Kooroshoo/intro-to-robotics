<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 40 380 320" width="380" height="320">
  <defs>
    <marker id="ctrl3dArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="ctrl3dArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="ctrl3dArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="ctrl3dArrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="ctrl3dArrowDark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Ground plane, drawn in isometric perspective, representing the X-Y plane the base can rotate over -->
  <ellipse cx="100" cy="280" rx="85" ry="26" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- theta1: base yaw, sweeping the whole arm's plane around the world Z axis -->
  <path d="M 118 308 A 42 15 0 0 0 86 248" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ctrl3dArrowDark)"/>
  <text x="143" y="318" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">&#952;_1</text>

  <!-- World reference axes at the base -->
  <line x1="100" y1="280" x2="172" y2="288" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ctrl3dArrowRed)"/>
  <line x1="100" y1="280" x2="32" y2="288" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ctrl3dArrowGreen)"/>
  <line x1="100" y1="280" x2="100" y2="228" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ctrl3dArrowBlue)"/>
  <text x="66" y="300" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">{W}</text>

  <!-- Base -->
  <circle cx="100" cy="280" r="6" fill="#333"/>

  <!-- Small horizontal reference at the base, mirroring theta2's own zero-angle reference -->
  <line x1="100" y1="280" x2="132" y2="280" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Joint angle theta2, from that horizontal reference to Link 1's direction -->
  <path d="M 120 280 A 20 20 0 0 0 109.5 262.4" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Link 1 (L2): base to the elbow joint, lifted by theta2 -->
  <line x1="100" y1="280" x2="150" y2="187" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <circle cx="150" cy="187" r="6" fill="#333"/>
  <text x="118" y="271" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">&#952;_2</text>

  <!-- Dashed extension of Link 1's own direction, theta3's zero-angle reference -->
  <line x1="150" y1="187" x2="172" y2="146.6" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Joint angle theta3, from that extended reference to Link 2's direction -->
  <path d="M 158.5 171.2 A 18 18 0 0 0 165.9 178.6" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Link 2 (L3): elbow joint to the current end-effector, bent further by theta3 -->
  <line x1="150" y1="187" x2="230" y2="145" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <text x="172" y="158" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">&#952;_3</text>

  <!-- Dashed error vector e, from current end-effector to goal -->
  <line x1="230" y1="145" x2="292" y2="208" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="248" y="185" font-family="sans-serif" font-size="15" font-weight="bold" fill="#64748b">e</text>

  <!-- Current end-effector position -->
  <g transform="translate(230, 145)">
    <circle cx="0" cy="0" r="6" fill="#0d9488"/>
    <path d="M 23.6 18 L 0 18 L 0 -18 L 23.6 -18" fill="none" stroke="#0d9488" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="196" y="118" font-family="sans-serif" font-size="13" fill="#64748b">(x_ee, y_ee, z_ee)</text>

  <!-- Goal end-effector position (grayed out): spine stays straight/vertical, only the fingers angle down-right -->
  <g transform="translate(292, 208)" opacity="0.4">
    <circle cx="0" cy="0" r="6" fill="#0d9488"/>
    <path d="M 0 18 L 0 -18" fill="none" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
    <path d="M 0 18 L 10 26" fill="none" stroke="#0d9488" stroke-width="8" stroke-linecap="round"/>
    <path d="M 0 -18 L 10 -10" fill="none" stroke="#0d9488" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="300" y="248" font-family="sans-serif" font-size="13" fill="#64748b">(x_g, y_g, z_g)</text>
</svg>

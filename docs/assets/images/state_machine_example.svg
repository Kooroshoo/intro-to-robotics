<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" width="780" height="310">
  <defs>
    <marker id="smArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Start arrow into the initial state -->
  <line x1="290" y1="48" x2="290" y2="95" stroke="#334155" stroke-width="2" marker-end="url(#smArrow)"/>

  <!-- Top edges: forward transitions -->
  <path d="M 320 100 Q 390 25 460 100" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#smArrow)"/>
  <path d="M 520 100 Q 590 25 660 100" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#smArrow)"/>

  <!-- Bottom edges: recovery/return transitions -->
  <path d="M 260 180 Q 190 245 120 180" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#smArrow)"/>
  <path d="M 460 180 Q 390 245 320 180" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#smArrow)"/>
  <path d="M 660 180 Q 590 245 520 180" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#smArrow)"/>

  <!-- Edge labels -->
  <g font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">
    <text x="390" y="30">Obstacle detected</text>
    <text x="590" y="30">Light decreases</text>
    <text x="190" y="260">Under light</text>
    <text x="390" y="260">Obstacle free</text>
    <text x="590" y="260">Light increases</text>
  </g>

  <!-- Nodes -->
  <!-- Stop: final state, drawn with a double circle -->
  <circle cx="90" cy="140" r="42" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <circle cx="90" cy="140" r="34" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="90" y="145" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e293b">Stop</text>

  <circle cx="290" cy="140" r="42" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="290" y="136" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">Follow</text>
  <text x="290" y="152" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">light</text>

  <circle cx="490" cy="140" r="42" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="490" y="136" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">Avoid</text>
  <text x="490" y="152" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">obstacle</text>

  <circle cx="690" cy="140" r="42" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="690" y="136" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">Follow</text>
  <text x="690" y="152" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">wall</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Panel 1: STABLE (smooth, no overshoot) -->
  <g transform="translate(20,50)">
    <line x1="30" y1="170" x2="250" y2="170" stroke="#333" stroke-width="1"/>
    <line x1="30" y1="170" x2="30" y2="10" stroke="#333" stroke-width="1"/>
    <text x="16" y="12" font-family="sans-serif" font-size="13" font-style="italic" fill="#333">x</text>
    <text x="252" y="182" font-family="sans-serif" font-size="13" font-style="italic" fill="#333">t</text>
    <path d="M 30 170 L 30 60 L 250 60" fill="none" stroke="#111" stroke-width="3"/>
    <path d="M 30 170 C 50 168, 60 140, 75 115 C 90 92, 105 78, 125 70 C 145 64, 170 61, 200 60 C 220 60, 235 60, 250 60"
          fill="none" stroke="#334155" stroke-width="2"/>
    <text x="140" y="205" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">STABLE</text>
  </g>

  <!-- Panel 2: MARGINALLY STABLE (sustained oscillation) -->
  <g transform="translate(320,50)">
    <line x1="30" y1="170" x2="250" y2="170" stroke="#333" stroke-width="1"/>
    <line x1="30" y1="170" x2="30" y2="10" stroke="#333" stroke-width="1"/>
    <text x="16" y="12" font-family="sans-serif" font-size="13" font-style="italic" fill="#333">x</text>
    <text x="252" y="182" font-family="sans-serif" font-size="13" font-style="italic" fill="#333">t</text>
    <path d="M 30 170 L 30 60 L 250 60" fill="none" stroke="#111" stroke-width="3"/>
    <path d="M 30 170 C 40 100, 50 25, 65 25 C 80 25, 90 95, 105 95 C 120 95, 130 25, 145 25 C 160 25, 170 95, 185 95 C 200 95, 210 25, 225 25 C 238 25, 245 45, 250 60"
          fill="none" stroke="#334155" stroke-width="2"/>
    <text x="140" y="205" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">MARGINALLY STABLE</text>
  </g>

  <!-- Panel 3: UNSTABLE (monotonic divergence) -->
  <g transform="translate(620,50)">
    <line x1="30" y1="170" x2="250" y2="170" stroke="#333" stroke-width="1"/>
    <line x1="30" y1="170" x2="30" y2="10" stroke="#333" stroke-width="1"/>
    <text x="16" y="12" font-family="sans-serif" font-size="13" font-style="italic" fill="#333">x</text>
    <text x="252" y="182" font-family="sans-serif" font-size="13" font-style="italic" fill="#333">t</text>
    <path d="M 30 170 L 30 60 L 250 60" fill="none" stroke="#111" stroke-width="3"/>
    <path d="M 30 170 C 70 165, 110 145, 140 115 C 165 90, 185 55, 200 30 C 210 15, 218 8, 225 5"
          fill="none" stroke="#334155" stroke-width="2"/>
    <text x="140" y="205" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">UNSTABLE</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 70 320 260" width="320" height="260">
  <defs>
    <marker id="aadArrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="50" y="100" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Actuator-space DOF</text>
  <text x="50" y="120" font-family="sans-serif" font-size="13" fill="#64748b">4 DOF: q_1, q_2, q_3, q_4</text>

  <g transform="translate(0,-30)">
  <!-- Arm, de-emphasized: the blue arrows carry the meaning here -->
  <line x1="100" y1="300" x2="140" y2="230" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <circle cx="100" cy="300" r="6" fill="#cbd5e1"/>
  <circle cx="140" cy="230" r="6" fill="#cbd5e1"/>

  <line x1="140" y1="230" x2="195" y2="205" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <circle cx="195" cy="205" r="6" fill="#cbd5e1"/>

  <line x1="195" y1="205" x2="230" y2="245" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>

  <!-- The hand: the arm's end-effector -->
  <circle cx="230" cy="245" r="6" fill="#16a34a"/>
  <path d="M 248 259 L 230 259 L 230 231 L 248 231" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- q_1 at the base -->
  <path d="M 100 286 A 14 14 0 1 1 86 300" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="86" y1="300" x2="86" y2="290" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aadArrowBlue)"/>
  <text x="55" y="304" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">q_1</text>

  <!-- q_2 at Joint 1 -->
  <path d="M 140 216 A 14 14 0 1 1 126 230" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="126" y1="230" x2="126" y2="220" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aadArrowBlue)"/>
  <text x="95" y="234" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">q_2</text>

  <!-- q_3 at Joint 2 -->
  <path d="M 195 191 A 14 14 0 1 1 181 205" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="181" y1="205" x2="181" y2="195" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aadArrowBlue)"/>
  <text x="150" y="209" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">q_3</text>

  <!-- q_4 at the hand -->
  <path d="M 230 231 A 14 14 0 1 1 216 245" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="216" y1="245" x2="216" y2="235" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aadArrowBlue)"/>
  <text x="185" y="254" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">q_4</text>
  </g>
</svg>

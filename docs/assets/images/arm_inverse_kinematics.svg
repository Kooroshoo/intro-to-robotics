<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 340 320" width="340" height="320">
  <defs>
    <marker id="ikArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Distance r from base to target -->
  <line x1="100" y1="300" x2="175" y2="170.1" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ikArrow)"/>
  <text x="152" y="234" font-family="sans-serif" font-size="13" font-style="italic" fill="#64748b">r</text>

  <!-- Elbow-down configuration (dashed) -->
  <line x1="100" y1="300" x2="64.8" y2="174.9" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-dasharray="2,7"/>
  <line x1="64.8" y1="174.9" x2="175" y2="170.1" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-dasharray="2,7"/>
  <circle cx="64.8" cy="174.9" r="5" fill="#94a3b8"/>
  <text x="30" y="168" font-family="sans-serif" font-size="12" fill="#64748b">elbow-down</text>

  <!-- Elbow-up configuration (solid) -->
  <line x1="100" y1="300" x2="225.9" y2="267.7" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <line x1="225.9" y1="267.7" x2="175" y2="170.1" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <circle cx="225.9" cy="267.7" r="6" fill="#333"/>
  <text x="234" y="272" font-family="sans-serif" font-size="12" fill="#334155">elbow-up</text>

  <!-- Base -->
  <circle cx="100" cy="300" r="6" fill="#333"/>
  <text x="76" y="320" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">{W}</text>

  <!-- Target -->
  <circle cx="175" cy="170.1" r="6" fill="#0d9488"/>
  <text x="183" y="166" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0d9488">(x_ee, y_ee)</text>
</svg>

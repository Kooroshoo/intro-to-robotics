<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <marker id="gdAxisArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333"/>
    </marker>
    <marker id="gdCurveArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="40" y1="20" x2="40" y2="260"/>
    <line x1="80" y1="20" x2="80" y2="260"/>
    <line x1="120" y1="20" x2="120" y2="260"/>
    <line x1="160" y1="20" x2="160" y2="260"/>
    <line x1="240" y1="20" x2="240" y2="260"/>
    <line x1="280" y1="20" x2="280" y2="260"/>
    <line x1="320" y1="20" x2="320" y2="260"/>
    <line x1="360" y1="20" x2="360" y2="260"/>
    <line x1="40" y1="210" x2="360" y2="210"/>
    <line x1="40" y1="160" x2="360" y2="160"/>
    <line x1="40" y1="110" x2="360" y2="110"/>
    <line x1="40" y1="60" x2="360" y2="60"/>
  </g>

  <!-- Axes -->
  <line x1="20" y1="260" x2="380" y2="260" stroke="#333" stroke-width="1.5" marker-start="url(#gdAxisArrow)" marker-end="url(#gdAxisArrow)"/>
  <line x1="200" y1="280" x2="200" y2="20" stroke="#333" stroke-width="1.5" marker-end="url(#gdAxisArrow)"/>
  <text x="386" y="265" font-family="sans-serif" font-size="14" font-style="italic" fill="#333">x</text>
  <text x="206" y="18" font-family="sans-serif" font-size="14" font-style="italic" fill="#333">y</text>

  <!-- Axis tick labels -->
  <g font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">
    <text x="40" y="274">-4</text>
    <text x="80" y="274">-3</text>
    <text x="120" y="274">-2</text>
    <text x="160" y="274">-1</text>
    <text x="240" y="274">1</text>
    <text x="280" y="274">2</text>
    <text x="320" y="274">3</text>
    <text x="360" y="274">4</text>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#333" text-anchor="end">
    <text x="194" y="214">1</text>
    <text x="194" y="164">2</text>
    <text x="194" y="114">3</text>
    <text x="194" y="64">4</text>
  </g>

  <!-- Parabola y = x^2, split into two branches so each end gets its own arrowhead -->
  <path d="M 114 28.9 L 120 60 L 126 88.9 L 132 115.5 L 138 139.9 L 144 162 L 150 181.9 L 156 199.5 L 162 214.9 L 168 228 L 174 238.9 L 180 247.5 L 186 253.9 L 192 258 L 198 259.9"
        fill="none" stroke="#2563eb" stroke-width="2.5" marker-start="url(#gdCurveArrow)"/>
  <path d="M 202 259.9 L 208 258 L 214 253.9 L 220 247.5 L 226 238.9 L 232 228 L 238 214.9 L 244 199.5 L 250 181.9 L 256 162 L 262 139.9 L 268 115.5 L 274 88.9 L 280 60 L 286 28.9"
        fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#gdCurveArrow)"/>

  <text x="230" y="95" font-family="sans-serif" font-size="16" font-style="italic" fill="#2563eb">y = x&#178;</text>

  <!-- Minimum at the origin -->
  <circle cx="200" cy="260" r="4" fill="#dc2626"/>
  <text x="206" y="272" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">(0, 0)</text>
</svg>

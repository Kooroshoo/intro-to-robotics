<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <defs>
    <marker id="crArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Rigid -->
  <text x="20" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Rigid</text>

  <line x1="30" y1="110" x2="68" y2="110" stroke="#334155" stroke-width="2.5" marker-end="url(#crArrow)"/>
  <text x="30" y="98" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">F</text>

  <rect x="80" y="75" width="24" height="70" fill="#334155"/>
  <line x1="80" y1="75" x2="80" y2="145" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

  <text x="20" y="180" font-family="sans-serif" font-size="12" fill="#64748b">Holds its position against the push</text>

  <!-- Compliant -->
  <text x="260" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Compliant</text>

  <line x1="270" y1="110" x2="308" y2="110" stroke="#334155" stroke-width="2.5" marker-end="url(#crArrow)"/>
  <text x="270" y="98" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">F</text>

  <path d="M 310 110 L 317 98 L 324 122 L 331 98 L 338 122 L 345 110" fill="none" stroke="#2563eb" stroke-width="2"/>

  <rect x="352" y="85" width="20" height="50" fill="#0d9488"/>

  <text x="260" y="180" font-family="sans-serif" font-size="12" fill="#64748b">Yields to the push, then settles</text>
</svg>

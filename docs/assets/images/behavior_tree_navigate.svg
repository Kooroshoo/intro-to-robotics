<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" width="740" height="320">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Repeat decorator into the selector node -->
  <polygon points="370,10 390,30 370,50 350,30" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="400" y="24" font-family="sans-serif" font-size="12" fill="#1e293b">Repeat</text>
  <line x1="370" y1="50" x2="370" y2="78" stroke="#334155" stroke-width="2"/>

  <!-- Connectors: root to its four children -->
  <line x1="370" y1="135" x2="100" y2="170" stroke="#334155" stroke-width="2"/>
  <line x1="370" y1="135" x2="280" y2="170" stroke="#334155" stroke-width="2"/>
  <line x1="370" y1="135" x2="460" y2="170" stroke="#334155" stroke-width="2"/>
  <line x1="370" y1="135" x2="640" y2="170" stroke="#334155" stroke-width="2"/>

  <!-- Connectors: "Avoid Obstacle" sequence to its two children -->
  <line x1="460" y1="225" x2="405" y2="255" stroke="#334155" stroke-width="2"/>
  <line x1="460" y1="225" x2="525" y2="255" stroke="#334155" stroke-width="2"/>

  <!-- Root: selector node -->
  <rect x="290" y="80" width="160" height="55" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="370" y="105" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#1e293b">Navigate</text>
  <text x="370" y="125" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1e293b">?</text>

  <!-- Leaves, tried left to right -->
  <rect x="20" y="170" width="160" height="60" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="100" y="205" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">Under light</text>

  <rect x="200" y="170" width="160" height="60" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="280" y="205" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">Follow Light</text>

  <!-- "Avoid Obstacle": a sequence node instead of a plain leaf -->
  <rect x="380" y="170" width="160" height="55" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="460" y="195" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">Avoid Obstacle</text>
  <text x="460" y="214" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1e293b">→</text>

  <rect x="560" y="170" width="160" height="60" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="640" y="205" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">Follow Wall</text>

  <!-- Children of the "Avoid Obstacle" sequence -->
  <rect x="345" y="255" width="120" height="55" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="405" y="278" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">Obstacle</text>
  <text x="405" y="293" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">Detected?</text>

  <rect x="465" y="255" width="120" height="55" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="525" y="287" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">Steer Around</text>
</svg>


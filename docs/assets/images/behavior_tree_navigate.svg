<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 0 830 255" width="830" height="255">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Connectors: root to its three children -->
  <line x1="450" y1="60" x2="150" y2="100" stroke="#334155" stroke-width="2"/>
  <line x1="450" y1="60" x2="450" y2="100" stroke="#334155" stroke-width="2"/>
  <line x1="450" y1="60" x2="750" y2="100" stroke="#334155" stroke-width="2"/>

  <!-- Connectors: "Handle Obstacle" to its two children -->
  <line x1="150" y1="150" x2="80" y2="190" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="150" x2="220" y2="190" stroke="#334155" stroke-width="2"/>

  <!-- Connectors: "Handle Wall" to its two children -->
  <line x1="450" y1="150" x2="380" y2="190" stroke="#334155" stroke-width="2"/>
  <line x1="450" y1="150" x2="520" y2="190" stroke="#334155" stroke-width="2"/>

  <!-- Root: selector node -->
  <rect x="380" y="10" width="140" height="50" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="450" y="33" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#1e293b">Navigate</text>
  <text x="450" y="52" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1e293b">?</text>

  <!-- Level 1: two sequences and a fallback leaf -->
  <rect x="70" y="100" width="160" height="50" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="150" y="122" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">Handle Obstacle</text>
  <text x="150" y="141" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1e293b">→</text>

  <rect x="370" y="100" width="160" height="50" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="450" y="122" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">Handle Wall</text>
  <text x="450" y="141" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1e293b">→</text>

  <rect x="670" y="100" width="160" height="55" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="750" y="132" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">Follow Light</text>

  <!-- Level 2: children of "Handle Obstacle" -->
  <rect x="20" y="190" width="120" height="55" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="80" y="213" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">Obstacle</text>
  <text x="80" y="228" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">Detected?</text>

  <rect x="160" y="190" width="120" height="55" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="220" y="213" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">Avoid</text>
  <text x="220" y="228" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">Obstacle</text>

  <!-- Level 2: children of "Handle Wall" -->
  <rect x="320" y="190" width="120" height="55" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="380" y="213" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">Light</text>
  <text x="380" y="228" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">Decreasing?</text>

  <rect x="460" y="190" width="120" height="55" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="520" y="221" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">Follow Wall</text>
</svg>

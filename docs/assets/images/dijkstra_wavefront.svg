<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Every free cell is a node, connected to its free neighbors -->
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="40" y1="50" x2="80" y2="50"/>
    <line x1="80" y1="50" x2="120" y2="50"/>
    <line x1="120" y1="50" x2="160" y2="50"/>
    <line x1="160" y1="50" x2="200" y2="50"/>
    <line x1="200" y1="50" x2="240" y2="50"/>
    <line x1="240" y1="50" x2="280" y2="50"/>
    <line x1="280" y1="50" x2="320" y2="50"/>

    <line x1="40" y1="90" x2="80" y2="90"/>
    <line x1="80" y1="90" x2="120" y2="90"/>
    <line x1="240" y1="90" x2="280" y2="90"/>
    <line x1="280" y1="90" x2="320" y2="90"/>

    <line x1="40" y1="130" x2="80" y2="130"/>
    <line x1="80" y1="130" x2="120" y2="130"/>

    <line x1="40" y1="170" x2="80" y2="170"/>
    <line x1="80" y1="170" x2="120" y2="170"/>
    <line x1="120" y1="170" x2="160" y2="170"/>
    <line x1="160" y1="170" x2="200" y2="170"/>

    <line x1="40" y1="210" x2="80" y2="210"/>
    <line x1="80" y1="210" x2="120" y2="210"/>
    <line x1="120" y1="210" x2="160" y2="210"/>
    <line x1="160" y1="210" x2="200" y2="210"/>
    <line x1="200" y1="210" x2="240" y2="210"/>
    <line x1="240" y1="210" x2="280" y2="210"/>
    <line x1="280" y1="210" x2="320" y2="210"/>

    <line x1="40" y1="250" x2="80" y2="250"/>
    <line x1="80" y1="250" x2="120" y2="250"/>
    <line x1="120" y1="250" x2="160" y2="250"/>
    <line x1="160" y1="250" x2="200" y2="250"/>
    <line x1="200" y1="250" x2="240" y2="250"/>
    <line x1="240" y1="250" x2="280" y2="250"/>
    <line x1="280" y1="250" x2="320" y2="250"/>

    <line x1="40" y1="50" x2="40" y2="90"/>
    <line x1="80" y1="50" x2="80" y2="90"/>
    <line x1="120" y1="50" x2="120" y2="90"/>
    <line x1="240" y1="50" x2="240" y2="90"/>
    <line x1="280" y1="50" x2="280" y2="90"/>
    <line x1="320" y1="50" x2="320" y2="90"/>

    <line x1="40" y1="90" x2="40" y2="130"/>
    <line x1="80" y1="90" x2="80" y2="130"/>
    <line x1="120" y1="90" x2="120" y2="130"/>
    <line x1="320" y1="90" x2="320" y2="130"/>

    <line x1="40" y1="130" x2="40" y2="170"/>
    <line x1="80" y1="130" x2="80" y2="170"/>
    <line x1="120" y1="130" x2="120" y2="170"/>
    <line x1="320" y1="130" x2="320" y2="170"/>

    <line x1="40" y1="170" x2="40" y2="210"/>
    <line x1="80" y1="170" x2="80" y2="210"/>
    <line x1="120" y1="170" x2="120" y2="210"/>
    <line x1="160" y1="170" x2="160" y2="210"/>
    <line x1="200" y1="170" x2="200" y2="210"/>
    <line x1="320" y1="170" x2="320" y2="210"/>

    <line x1="40" y1="210" x2="40" y2="250"/>
    <line x1="80" y1="210" x2="80" y2="250"/>
    <line x1="120" y1="210" x2="120" y2="250"/>
    <line x1="160" y1="210" x2="160" y2="250"/>
    <line x1="200" y1="210" x2="200" y2="250"/>
    <line x1="240" y1="210" x2="240" y2="250"/>
    <line x1="280" y1="210" x2="280" y2="250"/>
    <line x1="320" y1="210" x2="320" y2="250"/>
  </g>

  <!-- Nodes: unvisited (blue ring) -> frontier (red) -> visited (brown), expanding from the start -->
  <g fill="#ffffff" stroke="#2563eb">
    <circle cx="40" cy="50" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.4167;0.5;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="50" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.5;0.5833;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="50" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.5833;0.6667;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="50" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.6667;0.75;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="50" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.75;0.8333;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="50" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.8333;0.9167;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="50" r="4"/>

    <circle cx="40" cy="90" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.3333;0.4167;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="90" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.4167;0.5;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="90" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.5;0.5833;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="90" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309" keyTimes="0;0.9167;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="90" r="4"/>
    <circle cx="320" cy="90" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309" keyTimes="0;0.9167;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>

    <circle cx="40" cy="130" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.25;0.3333;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="130" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.3333;0.4167;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="130" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.4167;0.5;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="130" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.8333;0.9167;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>

    <circle cx="40" cy="170" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.1667;0.25;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="170" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.25;0.3333;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="170" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.3333;0.4167;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="170" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.4167;0.5;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="170" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.5;0.5833;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="170" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.75;0.8333;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>

    <circle cx="40" cy="210" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.0833;0.1667;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="210" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.1667;0.25;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="210" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.25;0.3333;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="210" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.3333;0.4167;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="210" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.4167;0.5;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="210" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.5;0.5833;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="210" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.5833;0.6667;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="210" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.6667;0.75;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>

    <circle cx="80" cy="250" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.0833;0.1667;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="250" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.1667;0.25;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="250" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.25;0.3333;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="250" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.3333;0.4167;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="250" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.4167;0.5;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="250" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.5;0.5833;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="250" r="4"><animate attributeName="fill" values="#ffffff;#dc2626;#b45309;#b45309" keyTimes="0;0.5833;0.6667;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Shortest path, revealed once the goal is reached -->
  <polyline points="40,250 120,250 120,50 280,50" fill="none" stroke="#16a34a" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.9167;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </polyline>

  <circle cx="40" cy="250" r="7" fill="#2563eb"/>
  <circle cx="280" cy="50" r="7" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
</svg>

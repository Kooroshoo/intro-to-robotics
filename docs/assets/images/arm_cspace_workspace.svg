<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="20" y="24" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Arm Workspace</text>

  <!-- Obstacle -->
  <circle cx="190" cy="160" r="26" fill="#94a3b8" stroke="#475569" stroke-width="2"/>

  <!-- Arm: base -> elbow -> end-effector, elbow bent to route above the obstacle -->
  <line x1="60" y1="240" x2="130" y2="120" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
  <line x1="130" y1="120" x2="250" y2="110" stroke="#334155" stroke-width="10" stroke-linecap="round"/>

  <circle cx="60" cy="240" r="9" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <circle cx="130" cy="120" r="8" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <circle cx="250" cy="110" r="7" fill="#2563eb"/>
</svg>

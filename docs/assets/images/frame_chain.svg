<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="600" height="368">
  <defs>
    <marker id="chainArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333"/>
    </marker>
    <marker id="chainArrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="chainArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="chainArrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="chainArrowTeal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- A to B -->
  <line x1="100" y1="270" x2="272" y2="195" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#chainArrow)"/>
  <text x="170" y="220" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">T_AB</text>

  <!-- B to C -->
  <line x1="272" y1="195" x2="430" y2="172" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#chainArrow)"/>
  <text x="340" y="163" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">T_BC</text>

  <!-- Frame A (World) -->
  <g transform="translate(100, 270)">
    <line x1="0" y1="0" x2="0" y2="-74" stroke="#333" stroke-width="2" marker-end="url(#chainArrow)"/>
    <text x="-5" y="-80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">Z_A</text>

    <line x1="0" y1="0" x2="64" y2="29" stroke="#dc2626" stroke-width="2" marker-end="url(#chainArrowRed)"/>
    <text x="70" y="36" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">X_A</text>

    <line x1="0" y1="0" x2="-64" y2="29" stroke="#2563eb" stroke-width="2" marker-end="url(#chainArrowBlue)"/>
    <text x="-70" y="36" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="end">Y_A</text>

    <circle cx="0" cy="0" r="4" fill="#333"/>
    <text x="-20" y="34" font-family="sans-serif" font-size="12" fill="#64748b">{A} World</text>
  </g>

  <!-- Frame B (Robot) -->
  <g transform="translate(272, 195) rotate(-20)">
    <line x1="0" y1="0" x2="0" y2="-53" stroke="#333" stroke-width="2" marker-end="url(#chainArrow)"/>
    <text x="-5" y="-58" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">Z_B</text>

    <line x1="0" y1="0" x2="46" y2="21" stroke="#dc2626" stroke-width="2" marker-end="url(#chainArrowRed)"/>
    <text x="53" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">X_B</text>

    <line x1="0" y1="0" x2="-46" y2="21" stroke="#2563eb" stroke-width="2" marker-end="url(#chainArrowBlue)"/>
    <text x="-53" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="end">Y_B</text>

    <circle cx="0" cy="0" r="4" fill="#333"/>
  </g>
  <text x="287" y="180" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">{B} Robot</text>

  <!-- Frame C (Sensor) -->
  <g transform="translate(430, 172) rotate(-15)">
    <line x1="0" y1="0" x2="0" y2="-43" stroke="#333" stroke-width="2" marker-end="url(#chainArrow)"/>
    <text x="-5" y="-47" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">Z_C</text>

    <line x1="0" y1="0" x2="36" y2="17" stroke="#dc2626" stroke-width="2" marker-end="url(#chainArrowRed)"/>
    <text x="41" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">X_C</text>

    <line x1="0" y1="0" x2="-36" y2="17" stroke="#2563eb" stroke-width="2" marker-end="url(#chainArrowBlue)"/>
    <text x="-41" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="end">Y_C</text>

    <circle cx="0" cy="0" r="4" fill="#333"/>
  </g>
  <text x="435" y="134" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">{C} Sensor</text>

  <!-- Vector from Frame C to a Target Point -->
  <line x1="430" y1="172" x2="526" y2="260" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#chainArrowTeal)"/>
  <text x="455" y="227" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0d9488">Q_C</text>

  <g transform="translate(526, 267)">
    <circle cx="0" cy="0" r="6" fill="#0d9488"/>
    <text x="12" y="4" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0d9488">Target Point</text>
  </g>

  <!-- Composed transform, straight from A to C -->
  <path d="M 100 282 Q 265 320 430 187" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#chainArrowGray)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 290" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="20" y="18" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">Occupancy Grid</text>

  <!-- Grid lines: 16 columns x 12 rows -->
  <g stroke="#cbd5e1">
    <line x1="20" y1="30" x2="20" y2="270"/>
    <line x1="40" y1="30" x2="40" y2="270"/>
    <line x1="60" y1="30" x2="60" y2="270"/>
    <line x1="80" y1="30" x2="80" y2="270"/>
    <line x1="100" y1="30" x2="100" y2="270"/>
    <line x1="120" y1="30" x2="120" y2="270"/>
    <line x1="140" y1="30" x2="140" y2="270"/>
    <line x1="160" y1="30" x2="160" y2="270"/>
    <line x1="180" y1="30" x2="180" y2="270"/>
    <line x1="200" y1="30" x2="200" y2="270"/>
    <line x1="220" y1="30" x2="220" y2="270"/>
    <line x1="240" y1="30" x2="240" y2="270"/>
    <line x1="260" y1="30" x2="260" y2="270"/>
    <line x1="280" y1="30" x2="280" y2="270"/>
    <line x1="300" y1="30" x2="300" y2="270"/>
    <line x1="320" y1="30" x2="320" y2="270"/>
    <line x1="340" y1="30" x2="340" y2="270"/>

    <line x1="20" y1="30" x2="340" y2="30"/>
    <line x1="20" y1="50" x2="340" y2="50"/>
    <line x1="20" y1="70" x2="340" y2="70"/>
    <line x1="20" y1="90" x2="340" y2="90"/>
    <line x1="20" y1="110" x2="340" y2="110"/>
    <line x1="20" y1="130" x2="340" y2="130"/>
    <line x1="20" y1="150" x2="340" y2="150"/>
    <line x1="20" y1="170" x2="340" y2="170"/>
    <line x1="20" y1="190" x2="340" y2="190"/>
    <line x1="20" y1="210" x2="340" y2="210"/>
    <line x1="20" y1="230" x2="340" y2="230"/>
    <line x1="20" y1="250" x2="340" y2="250"/>
    <line x1="20" y1="270" x2="340" y2="270"/>
  </g>

  <!-- Occupied cells: obstacle A and obstacle B, each now several cells wide -->
  <rect x="100" y="70" width="80" height="80" fill="#334155"/>
  <rect x="220" y="110" width="80" height="80" fill="#334155"/>

  <!-- Legend -->
  <rect x="365" y="70" width="18" height="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="390" y="84" font-family="sans-serif" font-size="13" fill="#334155">Free (0)</text>

  <rect x="365" y="100" width="18" height="18" fill="#334155"/>
  <text x="390" y="114" font-family="sans-serif" font-size="13" fill="#334155">Occupied (1)</text>
</svg>

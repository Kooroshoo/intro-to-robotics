<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" width="520" height="370">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="20" y="18" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">Occupancy Grid</text>

  <!-- Grid lines: 12 columns x 8 rows -->
  <g stroke="#cbd5e1">
    <line x1="20" y1="30" x2="20" y2="350"/>
    <line x1="60" y1="30" x2="60" y2="350"/>
    <line x1="100" y1="30" x2="100" y2="350"/>
    <line x1="140" y1="30" x2="140" y2="350"/>
    <line x1="180" y1="30" x2="180" y2="350"/>
    <line x1="220" y1="30" x2="220" y2="350"/>
    <line x1="260" y1="30" x2="260" y2="350"/>
    <line x1="300" y1="30" x2="300" y2="350"/>
    <line x1="340" y1="30" x2="340" y2="350"/>
    <line x1="380" y1="30" x2="380" y2="350"/>
    <line x1="420" y1="30" x2="420" y2="350"/>
    <line x1="460" y1="30" x2="460" y2="350"/>
    <line x1="500" y1="30" x2="500" y2="350"/>

    <line x1="20" y1="30" x2="500" y2="30"/>
    <line x1="20" y1="70" x2="500" y2="70"/>
    <line x1="20" y1="110" x2="500" y2="110"/>
    <line x1="20" y1="150" x2="500" y2="150"/>
    <line x1="20" y1="190" x2="500" y2="190"/>
    <line x1="20" y1="230" x2="500" y2="230"/>
    <line x1="20" y1="270" x2="500" y2="270"/>
    <line x1="20" y1="310" x2="500" y2="310"/>
    <line x1="20" y1="350" x2="500" y2="350"/>
  </g>

  <!-- Occupied cells: obstacle A and obstacle B (the border walls are marked with "1" but left unfilled) -->
  <rect x="220" y="110" width="80" height="80" fill="#334155"/>
  <rect x="340" y="190" width="80" height="80" fill="#334155"/>

  <!-- Free cells (0) -->
  <g font-family="sans-serif" font-size="16" text-anchor="middle" fill="#94a3b8">
    <text x="80" y="95">0</text><text x="120" y="95">0</text><text x="160" y="95">0</text><text x="200" y="95">0</text><text x="240" y="95">0</text><text x="280" y="95">0</text><text x="320" y="95">0</text><text x="360" y="95">0</text><text x="400" y="95">0</text><text x="440" y="95">0</text>

    <text x="80" y="135">0</text><text x="120" y="135">0</text><text x="160" y="135">0</text><text x="200" y="135">0</text><text x="320" y="135">0</text><text x="360" y="135">0</text><text x="400" y="135">0</text><text x="440" y="135">0</text>

    <text x="80" y="175">0</text><text x="120" y="175">0</text><text x="160" y="175">0</text><text x="200" y="175">0</text><text x="320" y="175">0</text><text x="360" y="175">0</text><text x="400" y="175">0</text><text x="440" y="175">0</text>

    <text x="80" y="215">0</text><text x="120" y="215">0</text><text x="160" y="215">0</text><text x="200" y="215">0</text><text x="240" y="215">0</text><text x="280" y="215">0</text><text x="320" y="215">0</text><text x="440" y="215">0</text>

    <text x="80" y="255">0</text><text x="120" y="255">0</text><text x="160" y="255">0</text><text x="200" y="255">0</text><text x="240" y="255">0</text><text x="280" y="255">0</text><text x="320" y="255">0</text><text x="440" y="255">0</text>

    <text x="80" y="295">0</text><text x="120" y="295">0</text><text x="160" y="295">0</text><text x="200" y="295">0</text><text x="240" y="295">0</text><text x="280" y="295">0</text><text x="320" y="295">0</text><text x="360" y="295">0</text><text x="400" y="295">0</text><text x="440" y="295">0</text>
  </g>

  <!-- Wall cells (1): dark text, since the fill is now much lighter -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#334155">
    <text x="40" y="55">1</text><text x="80" y="55">1</text><text x="120" y="55">1</text><text x="160" y="55">1</text><text x="200" y="55">1</text><text x="240" y="55">1</text><text x="280" y="55">1</text><text x="320" y="55">1</text><text x="360" y="55">1</text><text x="400" y="55">1</text><text x="440" y="55">1</text><text x="480" y="55">1</text>

    <text x="40" y="95">1</text><text x="480" y="95">1</text>

    <text x="40" y="135">1</text><text x="480" y="135">1</text>

    <text x="40" y="175">1</text><text x="480" y="175">1</text>

    <text x="40" y="215">1</text><text x="480" y="215">1</text>

    <text x="40" y="255">1</text><text x="480" y="255">1</text>

    <text x="40" y="295">1</text><text x="480" y="295">1</text>

    <text x="40" y="335">1</text><text x="80" y="335">1</text><text x="120" y="335">1</text><text x="160" y="335">1</text><text x="200" y="335">1</text><text x="240" y="335">1</text><text x="280" y="335">1</text><text x="320" y="335">1</text><text x="360" y="335">1</text><text x="400" y="335">1</text><text x="440" y="335">1</text><text x="480" y="335">1</text>
  </g>

  <!-- Obstacle cells (1): white text, still on the darker fill -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <text x="240" y="135">1</text><text x="280" y="135">1</text>
    <text x="240" y="175">1</text><text x="280" y="175">1</text>

    <text x="360" y="215">1</text><text x="400" y="215">1</text>
    <text x="360" y="255">1</text><text x="400" y="255">1</text>
  </g>
</svg>

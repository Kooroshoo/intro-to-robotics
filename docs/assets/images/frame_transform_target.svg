<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 350" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- World Frame {W} at (100, 280) -->
  <g transform="translate(100, 280)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="130" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">X_W</text>
    
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="-5" y="-130" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">Y_W</text>
    
    <circle cx="0" cy="0" r="4" fill="#333"/>
    <text x="-25" y="20" font-family="sans-serif" font-size="12" fill="#64748b">{W} World</text>
  </g>

  <!-- Translation Vector P from {W} to {R} -->
  <line x1="100" y1="280" x2="335" y2="138" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="175" y="195" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">P (Translation)</text>

  <!-- Robot Frame {R} at (350, 130) rotated slightly -->
  <g transform="translate(350, 130) rotate(-25)">
    <!-- Differential Drive Mobile Robot Top-Down View (forward = X_R) -->
    <rect x="-22" y="-28" width="44" height="8" rx="3" fill="#334155"/>
    <rect x="-22" y="20" width="44" height="8" rx="3" fill="#334155"/>
    <circle cx="0" cy="0" r="24" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="3" fill="#64748b"/>

    <!-- Robot Local Axes -->
    <line x1="0" y1="0" x2="85" y2="0" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="95" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">X_R</text>
    
    <line x1="0" y1="0" x2="0" y2="-85" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="-5" y="-95" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Y_R</text>
  </g>
  <!-- Shifted label a little bit right -->
  <text x="335" y="85" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">{R} Robot Frame</text>

  <!-- Vector from Robot to Target Point (positioned on the right side) -->
  <line x1="350" y1="130" x2="470" y2="205" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-teal)"/>
  <text x="420" y="160" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0d9488">Q_robot</text>

  <!-- Target Point (Object / LiDAR Hit on the right) -->
  <g transform="translate(480, 212)">
    <circle cx="0" cy="0" r="6" fill="#0d9488"/>
    <text x="12" y="4" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0d9488">Target Point</text>
  </g>
</svg>

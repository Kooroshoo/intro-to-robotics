<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 70 320 260" width="320" height="260">
  <defs>
    <marker id="acdArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="acdArrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="acdArrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="50" y="100" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Cartesian-space DOF</text>
  <text x="50" y="120" font-family="sans-serif" font-size="13" fill="#64748b">3 DOF: x, y, &#952;</text>

  <!-- World coordinate frame, bottom-left corner: not tied to the arm's base -->
  <g transform="translate(70, 305)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#acdArrowRed)"/>
    <text x="66" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">x</text>

    <line x1="0" y1="0" x2="0" y2="-60" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#acdArrowBlue)"/>
    <text x="6" y="-66" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">y</text>

    <circle cx="0" cy="0" r="3" fill="#334155"/>
  </g>

  <g transform="translate(0,-30)">
  <!-- Same arm, de-emphasized: only the end-effector's freedom matters here -->
  <g opacity="0.35">
    <line x1="100" y1="300" x2="140" y2="230" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <circle cx="100" cy="300" r="6" fill="#333"/>
    <circle cx="140" cy="230" r="6" fill="#333"/>

    <line x1="140" y1="230" x2="195" y2="205" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <circle cx="195" cy="205" r="6" fill="#333"/>

    <line x1="195" y1="205" x2="230" y2="245" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- End-effector stays the focus -->
  <circle cx="230" cy="245" r="6" fill="#0d9488"/>
  <path d="M 248 259 L 230 259 L 230 231 L 248 231" fill="none" stroke="#0d9488" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- theta, the end-effector's orientation DOF -->
  <path d="M 248 245 A 18 18 0 0 1 239 262" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#acdArrowOrange)"/>
  <text x="252" y="265" font-family="sans-serif" font-size="14" font-weight="bold" fill="#d97706">&#952;</text>
  </g>
</svg>

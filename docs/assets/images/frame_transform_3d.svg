<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="600" height="353">
  <defs>
    <marker id="arrow3d" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333"/>
    </marker>
    <marker id="arrow3d-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow3d-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow3d-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Ground plane hint -->
  <line x1="0" y1="272" x2="560" y2="272" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Translation Vector P from {W} to {R} -->
  <line x1="120" y1="248" x2="368" y2="124" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow3d)"/>
  <text x="212" y="178" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">P (Translation)</text>

  <!-- World Frame {W} -->
  <g transform="translate(120, 248)">
    <line x1="0" y1="0" x2="0" y2="-114" stroke="#333" stroke-width="2" marker-end="url(#arrow3d)"/>
    <text x="-8" y="-122" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Z_W</text>

    <line x1="0" y1="0" x2="98" y2="45" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow3d-red)"/>
    <text x="108" y="56" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">X_W</text>

    <line x1="0" y1="0" x2="-98" y2="45" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow3d-blue)"/>
    <text x="-108" y="56" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="end">Y_W</text>

    <circle cx="0" cy="0" r="4" fill="#333"/>
    <text x="-20" y="17" font-family="sans-serif" font-size="12" fill="#64748b">{W} World</text>
  </g>

  <!-- Robot Frame {R}, tilted to show a different 3D orientation -->
  <g transform="translate(368, 124) rotate(-20)">
    <line x1="0" y1="0" x2="0" y2="-82" stroke="#333" stroke-width="2" marker-end="url(#arrow3d)"/>
    <text x="-8" y="-90" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Z_R</text>

    <line x1="0" y1="0" x2="70" y2="33" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow3d-red)"/>
    <text x="80" y="43" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">X_R</text>

    <line x1="0" y1="0" x2="-70" y2="33" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow3d-blue)"/>
    <text x="-80" y="43" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="end">Y_R</text>

    <circle cx="0" cy="0" r="4" fill="#333"/>
  </g>
  <text x="345" y="78" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">{R} Robot Frame</text>

  <!-- Vector from Robot Frame to a Target Point (e.g. a LiDAR/sensor hit) -->
  <line x1="368" y1="124" x2="462" y2="208" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow3d-teal)"/>
  <text x="392" y="176" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0d9488">Q_robot</text>

  <g transform="translate(462, 214)">
    <circle cx="0" cy="0" r="6" fill="#0d9488"/>
    <text x="12" y="4" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0d9488">Target Point</text>
  </g>
</svg>

    <circle cx="40" cy="210" r="4"/><circle cx="80" cy="210" r="4"/><circle cx="120" cy="210" r="4"/><circle cx="160" cy="210" r="4"/><circle cx="240" cy="210" r="4"/><circle cx="280" cy="210" r="4"/><circle cx="320" cy="210" r="4"/>

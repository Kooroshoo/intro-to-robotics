<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" height="100%">
  <defs>
    <marker id="goalArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333"/>
    </marker>
    <marker id="goalArrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="goalArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- World axes -->
  <line x1="70" y1="350" x2="650" y2="350" stroke="#333" stroke-width="2" marker-end="url(#goalArrow)"/>
  <text x="658" y="355" font-family="sans-serif" font-size="15" fill="#333" font-style="italic">x</text>

  <line x1="70" y1="350" x2="70" y2="30" stroke="#333" stroke-width="2" marker-end="url(#goalArrow)"/>
  <text x="58" y="22" font-family="sans-serif" font-size="15" fill="#333" font-style="italic">y</text>

  <!-- Distance rho, from the robot to the goal -->
  <line x1="150" y1="280" x2="500" y2="90" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#goalArrowGray)"/>
  <text x="290" y="175" font-family="sans-serif" font-size="15" font-weight="bold" fill="#64748b">&#961;</text>

  <!-- Current Robot Pose -->
  <g transform="translate(150, 280)">
    <g transform="rotate(20)">
      <rect x="-22" y="-28" width="44" height="8" rx="3" fill="#334155"/>
      <rect x="-22" y="20" width="44" height="8" rx="3" fill="#334155"/>
      <circle cx="0" cy="0" r="24" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="3" fill="#64748b"/>

      <!-- Heading direction -->
      <line x1="0" y1="0" x2="60" y2="0" stroke="#dc2626" stroke-width="2" marker-end="url(#goalArrowRed)"/>
      <text x="64" y="-6" font-family="sans-serif" font-size="13" fill="#dc2626" font-style="italic">x_r</text>

      <!-- Angle alpha, between heading and the line to the goal -->
      <path d="M 45 0 A 45 45 0 0 0 29.8 -33.7" fill="none" stroke="#334155" stroke-width="1.5"/>
      <text x="54" y="-24" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">&#945;</text>
    </g>
    <text x="-18" y="52" font-family="sans-serif" font-size="13" fill="#64748b">(x_r, y_r, &#952;_r)</text>
  </g>

  <!-- Goal Pose (grayed out) -->
  <g transform="translate(500, 90)" opacity="0.4">
    <g transform="rotate(-135)">
      <rect x="-22" y="-28" width="44" height="8" rx="3" fill="#334155"/>
      <rect x="-22" y="20" width="44" height="8" rx="3" fill="#334155"/>
      <circle cx="0" cy="0" r="24" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="3" fill="#64748b"/>
      <line x1="0" y1="0" x2="60" y2="0" stroke="#dc2626" stroke-width="2" marker-end="url(#goalArrowRed)"/>
    </g>
    <text x="-50" y="-50" font-family="sans-serif" font-size="13" fill="#dc2626" font-style="italic" text-anchor="end">x_r</text>
  </g>
  <text x="525" y="70" font-family="sans-serif" font-size="13" fill="#64748b">(x_g, y_g, &#952;_g)</text>

  <!-- Heading error inset: theta_r vs theta_g, matching the reference sketch -->
  <g transform="translate(560, 310)">
    <line x1="0" y1="0" x2="63" y2="0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3"/>

    <line x1="0" y1="0" x2="-54.5" y2="-54.5" stroke="#333" stroke-width="2" marker-end="url(#goalArrow)"/>
    <text x="-60" y="-59" font-family="sans-serif" font-size="14" fill="#333" font-style="italic" text-anchor="end">x_r</text>

    <line x1="0" y1="0" x2="72.4" y2="26.3" stroke="#333" stroke-width="2" marker-end="url(#goalArrow)"/>
    <text x="80" y="29" font-family="sans-serif" font-size="14" fill="#333" font-style="italic">x_r</text>

    <text x="11.5" y="-12" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">&#952;_g</text>

    <text x="42" y="10" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">&#952;_r</text>

    <path d="M -39.6 -39.6 A 56 56 0 0 1 52.6 19.2" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="38" y="-52" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">&#951;</text>
  </g>
</svg>

  <!-- Path from start to goal, through the gap between the two obstacles -->
  <polyline points="40,250 120,250 120,50 280,50" fill="none" stroke="#16a34a" stroke-width="4"/>
  <circle cx="120" cy="250" r="6" fill="#16a34a"/>
  <circle cx="120" cy="50" r="6" fill="#16a34a"/>

  <circle cx="40" cy="250" r="7" fill="#2563eb"/>
  <circle cx="280" cy="50" r="7" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>

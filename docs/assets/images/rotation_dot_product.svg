<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 350" width="100%" height="100%">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <g transform="translate(190, 290)">
    <!-- World Frame axes (fixed, dashed) -->
    <line x1="0" y1="0" x2="170" y2="0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGray)"/>
    <text x="180" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#64748b">X_W</text>

    <line x1="0" y1="0" x2="0" y2="-170" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGray)"/>
    <text x="-8" y="-180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#64748b" text-anchor="middle">Y_W</text>

    <!-- Angle between X_W and X_R -->
    <path d="M 40 0 A 40 40 0 0 0 32.8 -22.9" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="52" y="-12" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">&#945;</text>

    <!-- Robot Frame axes, rotated by alpha relative to the world -->
    <g transform="rotate(-35)">
      <line x1="0" y1="0" x2="150" y2="0" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
      <text x="160" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">X_R</text>

      <line x1="0" y1="0" x2="0" y2="-150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
      <text x="-8" y="-160" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Y_R</text>

      <!-- Example point and its projections onto the robot's axes -->
      <circle cx="65" cy="-105" r="5" fill="#d97706"/>
      <text x="75" y="-108" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d97706">P</text>
      <line x1="65" y1="-105" x2="65" y2="0" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="65" y1="-105" x2="0" y2="-105" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3"/>
    </g>

    <!-- Z axis, pointing out of the page, shared by both frames -->
    <circle cx="0" cy="0" r="7" fill="none" stroke="#333" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#333"/>
    <text x="-14" y="18" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">Z_R, Z_W</text>
  </g>
</svg>

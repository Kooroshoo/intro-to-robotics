<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" width="650" height="300">
  <defs>
    <marker id="pidArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Input r(t) into the first summing junction -->
  <text x="8" y="145" font-family="serif" font-style="italic" font-size="14" fill="#333">r(t)</text>
  <line x1="30" y1="150" x2="72" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#pidArrow)"/>

  <circle cx="88" cy="150" r="16" fill="#fde68a" stroke="#333" stroke-width="1.5"/>
  <text x="88" y="155" font-family="serif" font-size="15" text-anchor="middle" fill="#333">&#931;</text>
  <text x="64" y="138" font-family="sans-serif" font-size="12" fill="#333">+</text>
  <text x="98" y="180" font-family="sans-serif" font-size="12" fill="#333">-</text>

  <!-- e(t) split to the three terms -->
  <line x1="104" y1="150" x2="150" y2="150" stroke="#333" stroke-width="1.5"/>
  <text x="108" y="140" font-family="serif" font-style="italic" font-size="13" fill="#333">e(t)</text>
  <line x1="150" y1="150" x2="150" y2="80" stroke="#333" stroke-width="1.5"/>
  <line x1="150" y1="150" x2="150" y2="220" stroke="#333" stroke-width="1.5"/>
  <line x1="150" y1="80" x2="195" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#pidArrow)"/>
  <line x1="150" y1="150" x2="195" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#pidArrow)"/>
  <line x1="150" y1="220" x2="195" y2="220" stroke="#333" stroke-width="1.5" marker-end="url(#pidArrow)"/>

  <!-- P term -->
  <rect x="200" y="60" width="105" height="40" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="210" y="86" font-family="sans-serif" font-size="15" font-weight="bold" fill="#166534">P</text>
  <text x="232" y="86" font-family="serif" font-style="italic" font-size="13" fill="#166534">K<tspan baseline-shift="sub" font-size="9">p</tspan> e(t)</text>

  <!-- I term -->
  <rect x="200" y="130" width="105" height="40" fill="#a5f3fc" stroke="#0891b2" stroke-width="1.5"/>
  <text x="210" y="156" font-family="sans-serif" font-size="15" font-weight="bold" fill="#155e75">I</text>
  <text x="228" y="156" font-family="serif" font-style="italic" font-size="12" fill="#155e75">K<tspan baseline-shift="sub" font-size="9">i</tspan> &#8747;e(&#964;)d&#964;</text>

  <!-- D term -->
  <rect x="200" y="200" width="105" height="40" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="210" y="226" font-family="sans-serif" font-size="15" font-weight="bold" fill="#9a3412">D</text>
  <text x="228" y="226" font-family="serif" font-style="italic" font-size="12" fill="#9a3412">K<tspan baseline-shift="sub" font-size="9">d</tspan> de(t)/dt</text>

  <!-- Recombine into the second summing junction, right-angled like the incoming P/I/D arrows -->
  <path d="M 305 80 L 410 80 L 410 132" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#pidArrow)"/>
  <line x1="305" y1="150" x2="392" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#pidArrow)"/>
  <path d="M 305 220 L 410 220 L 410 168" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#pidArrow)"/>

  <circle cx="410" cy="150" r="16" fill="#fde68a" stroke="#333" stroke-width="1.5"/>
  <text x="410" y="155" font-family="serif" font-size="15" text-anchor="middle" fill="#333">&#931;</text>
  <text x="416" y="122" font-family="sans-serif" font-size="12" fill="#333">+</text>
  <text x="388" y="140" font-family="sans-serif" font-size="12" fill="#333">+</text>
  <text x="416" y="182" font-family="sans-serif" font-size="12" fill="#333">+</text>

  <!-- Control signal u(t) into the plant -->
  <line x1="426" y1="150" x2="468" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#pidArrow)"/>
  <text x="428" y="140" font-family="serif" font-style="italic" font-size="13" fill="#333">u(t)</text>

  <rect x="470" y="130" width="110" height="40" fill="#e2e8f0" stroke="#333" stroke-width="1.5"/>
  <text x="484" y="146" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333">Plant /</text>
  <text x="484" y="162" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333">Process</text>

  <!-- Output y(t) -->
  <line x1="580" y1="150" x2="622" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#pidArrow)"/>
  <text x="600" y="140" font-family="serif" font-style="italic" font-size="13" fill="#333">y(t)</text>

  <!-- Feedback loop back into the first summing junction -->
  <line x1="605" y1="150" x2="605" y2="255" stroke="#333" stroke-width="1.5"/>
  <line x1="605" y1="255" x2="88" y2="255" stroke="#333" stroke-width="1.5"/>
  <line x1="88" y1="255" x2="88" y2="167" stroke="#333" stroke-width="1.5" marker-end="url(#pidArrow)"/>
</svg>

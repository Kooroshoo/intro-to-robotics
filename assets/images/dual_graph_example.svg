<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="300" height="260">
  <defs>
    <marker id="dualArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Original edges, now just connections between the dual graph's nodes -->
  <line x1="112" y1="60" x2="188" y2="60" stroke="#334155" stroke-width="3" marker-start="url(#dualArrow)" marker-end="url(#dualArrow)"/>
  <line x1="80" y1="92" x2="80" y2="148" stroke="#334155" stroke-width="3" marker-end="url(#dualArrow)"/>
  <line x1="112" y1="180" x2="188" y2="180" stroke="#334155" stroke-width="3" marker-start="url(#dualArrow)" marker-end="url(#dualArrow)"/>

  <!-- Original nodes -->
  <circle cx="80" cy="60" r="26" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="80" y="67" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">A</text>

  <circle cx="220" cy="60" r="26" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="220" y="67" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">C</text>

  <circle cx="80" cy="180" r="26" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="80" y="187" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">B</text>

  <circle cx="220" cy="180" r="26" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="220" y="187" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">D</text>

  <!-- Dual graph nodes: one per original edge -->
  <circle cx="150" cy="60" r="9" fill="#1e293b"/>
  <text x="150" y="42" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">AC</text>

  <circle cx="80" cy="120" r="9" fill="#1e293b"/>
  <text x="102" y="124" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">AB</text>

  <circle cx="150" cy="180" r="9" fill="#1e293b"/>
  <text x="150" y="200" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">BD</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" height="100%">
  <defs>
    <marker id="obsArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333"/>
    </marker>
    <marker id="obsArrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="obsArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="obsArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- World axes -->
  <line x1="70" y1="350" x2="650" y2="350" stroke="#333" stroke-width="2" marker-end="url(#obsArrow)"/>
  <text x="658" y="355" font-family="sans-serif" font-size="15" fill="#333" font-style="italic">x</text>

  <line x1="70" y1="350" x2="70" y2="30" stroke="#333" stroke-width="2" marker-end="url(#obsArrow)"/>
  <text x="58" y="22" font-family="sans-serif" font-size="15" fill="#333" font-style="italic">y</text>

  <!-- Direct path to the goal, blocked -->
  <line x1="150" y1="280" x2="281" y2="209" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#obsArrowGray)"/>
  <line x1="369" y1="161" x2="474" y2="104" stroke="#94a3b8" stroke-width="2" stroke-dasharray="2,6"/>

  <!-- Blocked marker -->
  <line x1="273" y1="201" x2="289" y2="217" stroke="#dc2626" stroke-width="3"/>
  <line x1="273" y1="217" x2="289" y2="201" stroke="#dc2626" stroke-width="3"/>

  <!-- Obstacle -->
  <g transform="translate(325, 185) rotate(-25)">
    <rect x="-50" y="-35" width="100" height="70" rx="8" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
  </g>
  <text x="290" y="255" font-family="sans-serif" font-size="14" fill="#475569">obstacle</text>

  <!-- A path that detours around the obstacle instead -->
  <path d="M150,280 Q220,-40 500,90" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="8,5" marker-end="url(#obsArrowGreen)"/>
  <text x="220" y="35" font-family="sans-serif" font-size="14" font-style="italic" fill="#16a34a">...or find a way around?</text>

  <!-- Current Robot Pose, facing the goal -->
  <g transform="translate(150, 280)">
    <g transform="rotate(-28)">
      <rect x="-22" y="-28" width="44" height="8" rx="3" fill="#334155"/>
      <rect x="-22" y="20" width="44" height="8" rx="3" fill="#334155"/>
      <circle cx="0" cy="0" r="24" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="3" fill="#64748b"/>

      <!-- Heading direction -->
      <line x1="0" y1="0" x2="60" y2="0" stroke="#dc2626" stroke-width="2" marker-end="url(#obsArrowRed)"/>
    </g>
  </g>

  <!-- Goal marker -->
  <path d="M500,62 L507.1,80.3 L526.6,81.4 L511.4,93.7 L516.5,112.7 L500,102 L483.5,112.7 L488.6,93.7 L473.4,81.4 L493,80.3 Z" fill="#f59e0b" stroke="#b45309" stroke-width="2" stroke-linejoin="round"/>
</svg>

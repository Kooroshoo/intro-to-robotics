<svg xmlns="http://www.w3.org/2000/svg" viewBox="47 73 300 300" width="340" height="340">
  <defs>
    <marker id="armArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333"/>
    </marker>
    <marker id="armArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="armArrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- World reference axes at the base -->
  <line x1="100" y1="300" x2="150" y2="300" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#armArrowRed)"/>
  <line x1="100" y1="300" x2="100" y2="255" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#armArrowBlue)"/>
  <text x="70" y="318" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">{W}</text>

  <!-- Joint angle theta1, from the world reference to Link 1 -->
  <path d="M 140 300 A 40 40 0 0 0 120 265.4" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="142" y="273" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">&#952;_1</text>

  <!-- Link 1: base to Joint 1 -->
  <line x1="100" y1="300" x2="165" y2="187.4" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <text x="88" y="238" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">T_W1</text>

  <circle cx="100" cy="300" r="6" fill="#333"/>
  <circle cx="165" cy="187.4" r="6" fill="#333"/>
  <text x="168" y="206" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">{1}</text>

  <!-- Small horizontal reference line at Joint 1, mirroring theta1's world-horizontal reference -->
  <line x1="165" y1="189.4" x2="200" y2="189.4" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Joint angle theta2, from Link 1's own direction to Link 2 -->
  <g transform="translate(14,8) rotate(15 178 175)">
    <path d="M 174 171.8 A 18 18 0 0 1 181.9 181.2" fill="none" stroke="#334155" stroke-width="1.5"/>
  </g>
  <text x="210" y="186" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">&#952;_2</text>

  <!-- Link 2: Joint 1 to the end-effector -->
  <line x1="165" y1="187.4" x2="268.4" y2="149.8" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <text x="195" y="158" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">T_12</text>

  <circle cx="268.4" cy="149.8" r="6" fill="#0d9488"/>

  <!-- Simple gripper at the end-effector -->
  <!-- Simple bracket-style gripper at the end-effector -->
  <path d="M 292 167.8 L 268.4 167.8 L 268.4 131.8 L 292 131.8" fill="none" stroke="#0d9488" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="300" y="154" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0d9488">{ee}</text>
</svg>

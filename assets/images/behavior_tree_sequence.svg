<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Connectors from root to leaves -->
  <line x1="380" y1="55" x2="140" y2="110" stroke="#334155" stroke-width="2"/>
  <line x1="380" y1="55" x2="380" y2="110" stroke="#334155" stroke-width="2"/>
  <line x1="380" y1="55" x2="620" y2="110" stroke="#334155" stroke-width="2"/>

  <!-- Root: sequence node -->
  <rect x="300" y="5" width="160" height="50" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="380" y="27" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">Insert Square Peg</text>
  <text x="380" y="49" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#1e293b">&#8594;</text>

  <!-- Leaves -->
  <rect x="60" y="110" width="160" height="55" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="140" y="134" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">Move peg</text>
  <text x="140" y="152" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">over hole</text>

  <rect x="300" y="110" width="160" height="55" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="380" y="134" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">Rotate Peg</text>
  <text x="380" y="152" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">until aligned</text>

  <rect x="540" y="110" width="160" height="55" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="620" y="134" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">Move peg down</text>
  <text x="620" y="152" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">until contact</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" width="560" height="190">
  <defs>
    <marker id="mbArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Model-Based -->
  <text x="20" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Model-Based</text>

  <rect x="20" y="80" width="90" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="65" y="105" font-family="sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle">Equations</text>

  <line x1="110" y1="100" x2="148" y2="100" stroke="#334155" stroke-width="1.5" marker-end="url(#mbArrow)"/>

  <rect x="150" y="80" width="90" height="40" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="195" y="105" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">Controller</text>

  <text x="20" y="160" font-family="sans-serif" font-size="12" fill="#64748b">This book: an explicit math model</text>
  <text x="20" y="176" font-family="sans-serif" font-size="12" fill="#64748b">(frames, Jacobians) drives the controller.</text>

  <!-- Model-Free -->
  <text x="320" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Model-Free</text>

  <rect x="320" y="80" width="80" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="105" font-family="sans-serif" font-size="13" fill="#92400e" text-anchor="middle">Data</text>

  <line x1="400" y1="100" x2="438" y2="100" stroke="#334155" stroke-width="1.5" marker-end="url(#mbArrow)"/>

  <rect x="440" y="80" width="100" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="490" y="105" font-family="sans-serif" font-size="13" fill="#92400e" text-anchor="middle">Learned Policy</text>

  <text x="320" y="160" font-family="sans-serif" font-size="12" fill="#64748b">Learns a control policy directly from</text>
  <text x="320" y="176" font-family="sans-serif" font-size="12" fill="#64748b">experience, without an explicit model.</text>
</svg>

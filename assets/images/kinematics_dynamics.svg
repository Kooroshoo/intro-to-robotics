<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs>
    <marker id="kdArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="kdArrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Kinematics -->
  <text x="20" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Kinematics</text>

  <path d="M 40 150 Q 90 130 128 92" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="128" cy="92" r="5" fill="#334155"/>
  <line x1="128" y1="92" x2="160" y2="72" stroke="#2563eb" stroke-width="2.5" marker-end="url(#kdArrow)"/>
  <text x="166" y="70" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">v</text>

  <text x="20" y="180" font-family="sans-serif" font-size="12" fill="#64748b">Positions and velocities — pure geometry</text>

  <!-- Dynamics -->
  <text x="280" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Dynamics</text>

  <line x1="300" y1="110" x2="336" y2="110" stroke="#334155" stroke-width="2.5" marker-end="url(#kdArrowSlate)"/>
  <text x="305" y="98" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">F</text>

  <rect x="340" y="90" width="42" height="42" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="361" y="116" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">m</text>

  <path d="M 392 96 A 16 16 0 0 1 400 118" fill="none" stroke="#d97706" stroke-width="2"/>
  <line x1="400" y1="118" x2="396" y2="124" stroke="#d97706" stroke-width="2" marker-end="url(#kdArrow)"/>
  <text x="404" y="112" font-family="sans-serif" font-size="14" font-weight="bold" fill="#d97706">&#964;</text>

  <text x="280" y="180" font-family="sans-serif" font-size="12" fill="#64748b">Forces, torques, and mass — why it moves</text>
</svg>

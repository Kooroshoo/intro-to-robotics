<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="480" height="210">
  <defs>
    <marker id="jtArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Revolute -->
  <text x="20" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Revolute Joint</text>

  <line x1="40" y1="150" x2="100" y2="110" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="110" x2="160" y2="130" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <circle cx="100" cy="110" r="7" fill="#333"/>

  <path d="M 100 92 A 18 18 0 1 1 82 110" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="82" y1="110" x2="76" y2="102" stroke="#2563eb" stroke-width="2.5" marker-end="url(#jtArrow)"/>
  <text x="55" y="95" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">q</text>

  <text x="20" y="180" font-family="sans-serif" font-size="12" fill="#64748b">Rotates about a fixed point</text>

  <!-- Prismatic -->
  <text x="260" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Prismatic Joint</text>

  <line x1="260" y1="120" x2="440" y2="120" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <rect x="330" y="102" width="34" height="36" rx="4" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>

  <line x1="340" y1="90" x2="300" y2="90" stroke="#2563eb" stroke-width="2.5" marker-end="url(#jtArrow)"/>
  <line x1="340" y1="90" x2="380" y2="90" stroke="#2563eb" stroke-width="2.5" marker-end="url(#jtArrow)"/>
  <text x="335" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">d</text>

  <text x="260" y="180" font-family="sans-serif" font-size="12" fill="#64748b">Slides along a fixed axis</text>
</svg>

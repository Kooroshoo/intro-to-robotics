<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" height="100%">
  <defs>
    <marker id="goalArrowSimple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333"/>
    </marker>
    <marker id="goalArrowGraySimple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="goalArrowRedSimple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- World axes -->
  <line x1="70" y1="350" x2="650" y2="350" stroke="#333" stroke-width="2" marker-end="url(#goalArrowSimple)"/>
  <text x="658" y="355" font-family="sans-serif" font-size="15" fill="#333" font-style="italic">x</text>

  <line x1="70" y1="350" x2="70" y2="30" stroke="#333" stroke-width="2" marker-end="url(#goalArrowSimple)"/>
  <text x="58" y="22" font-family="sans-serif" font-size="15" fill="#333" font-style="italic">y</text>

  <!-- Gap between current and goal pose -->
  <line x1="150" y1="280" x2="500" y2="90" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#goalArrowGraySimple)"/>
  <text x="290" y="175" font-family="sans-serif" font-size="15" font-style="italic" fill="#64748b">error</text>

  <!-- Current Robot Pose -->
  <g transform="translate(150, 280)">
    <g transform="rotate(20)">
      <rect x="-22" y="-28" width="44" height="8" rx="3" fill="#334155"/>
      <rect x="-22" y="20" width="44" height="8" rx="3" fill="#334155"/>
      <circle cx="0" cy="0" r="24" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="3" fill="#64748b"/>

      <!-- Heading direction -->
      <line x1="0" y1="0" x2="60" y2="0" stroke="#dc2626" stroke-width="2" marker-end="url(#goalArrowRedSimple)"/>
    </g>
  </g>

  <!-- Goal Pose (grayed out) -->
  <g transform="translate(500, 90)" opacity="0.4">
    <g transform="rotate(-135)">
      <rect x="-22" y="-28" width="44" height="8" rx="3" fill="#334155"/>
      <rect x="-22" y="20" width="44" height="8" rx="3" fill="#334155"/>
      <circle cx="0" cy="0" r="24" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="3" fill="#64748b"/>
      <line x1="0" y1="0" x2="60" y2="0" stroke="#dc2626" stroke-width="2" marker-end="url(#goalArrowRedSimple)"/>
    </g>
  </g>
</svg>

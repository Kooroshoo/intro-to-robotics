<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="20" y="24" font-family="sans-serif" font-size="15" font-weight="bold" fill="#000000">Configuration Space</text>

  <!-- Room boundary -->
  <rect x="20" y="35" width="260" height="250" fill="none" stroke="#000000" stroke-width="3"/>

  <!-- Obstacles, grown by the robot's own size: the gap between them has closed -->
  <polygon points="60,75 160,65 172,165 68,175" fill="#000000"/>
  <polygon points="130,135 230,123 242,227 138,237" fill="#000000"/>

  <!-- Robot, now just a point -->
  <circle cx="50" cy="260" r="4" fill="#000000"/>

  <!-- Goal, now just a point -->
  <circle cx="240" cy="50" r="4" fill="#000000"/>
</svg>

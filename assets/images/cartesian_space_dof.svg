<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260">
  <defs>
    <marker id="csdArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="csdArrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="csdArrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="20" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Cartesian-space DOF</text>
  <text x="20" y="50" font-family="sans-serif" font-size="13" fill="#64748b">3 DOF: x, y, &#952;</text>

  <!-- Same robot, de-emphasized: only its motion in the world matters here -->
  <g transform="translate(110, 145)">
    <rect x="-22" y="-28" width="44" height="8" rx="3" fill="#cbd5e1"/>
    <rect x="-22" y="20" width="44" height="8" rx="3" fill="#cbd5e1"/>
    <circle cx="0" cy="0" r="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="3" fill="#cbd5e1"/>

    <!-- theta -->
    <path d="M 34 0 A 34 34 0 0 1 24 24" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#csdArrowOrange)"/>
    <text x="40" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#d97706">&#952;</text>
  </g>

  <!-- World coordinate frame, bottom-left corner -->
  <g transform="translate(40, 225)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#csdArrowRed)"/>
    <text x="66" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">x</text>

    <line x1="0" y1="0" x2="0" y2="-60" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#csdArrowBlue)"/>
    <text x="6" y="-66" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">y</text>

    <circle cx="0" cy="0" r="3" fill="#334155"/>
  </g>
</svg>

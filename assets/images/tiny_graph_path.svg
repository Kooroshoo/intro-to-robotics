<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 230" width="230" height="230">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <g stroke="#334155" stroke-width="2">
    <line x1="45" y1="55" x2="115" y2="55"/>
    <line x1="115" y1="55" x2="185" y2="55"/>

    <line x1="45" y1="195" x2="115" y2="195"/>
    <line x1="115" y1="195" x2="185" y2="195"/>

    <line x1="185" y1="55" x2="185" y2="125"/>
    <line x1="185" y1="125" x2="185" y2="195"/>
  </g>

  <!-- Path found: (0,0) -> (0,1) -> (0,2) -> (1,2) -> (2,2) -> (2,1) -> (2,0), revealed once the goal is reached -->
  <g stroke="#16a34a" stroke-width="4" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.5;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
    <line x1="45" y1="55" x2="115" y2="55"/>
    <line x1="115" y1="55" x2="185" y2="55"/>
    <line x1="185" y1="55" x2="185" y2="125"/>
    <line x1="185" y1="125" x2="185" y2="195"/>
    <line x1="185" y1="195" x2="115" y2="195"/>
    <line x1="115" y1="195" x2="45" y2="195"/>
  </g>

  <circle cx="45" cy="55" r="20" fill="#2563eb"/>
  <text x="45" y="60" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">0,0</text>

  <!-- unvisited (white, orange ring) -> frontier (red) -> visited (orange, filled) -->
  <circle cx="115" cy="55" r="20" fill="#ffffff" stroke="#f97316" stroke-width="2">
    <animate attributeName="fill" values="#ffffff;#dc2626;#f97316;#f97316;#ffffff" keyTimes="0;0.0833;0.1667;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#f97316;#dc2626;#c2410c;#c2410c;#f97316" keyTimes="0;0.0833;0.1667;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="115" y="60" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">0,1</text>

  <circle cx="185" cy="55" r="20" fill="#ffffff" stroke="#f97316" stroke-width="2">
    <animate attributeName="fill" values="#ffffff;#dc2626;#f97316;#f97316;#ffffff" keyTimes="0;0.1667;0.25;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#f97316;#dc2626;#c2410c;#c2410c;#f97316" keyTimes="0;0.1667;0.25;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="185" y="60" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">0,2</text>

  <circle cx="185" cy="125" r="20" fill="#ffffff" stroke="#f97316" stroke-width="2">
    <animate attributeName="fill" values="#ffffff;#dc2626;#f97316;#f97316;#ffffff" keyTimes="0;0.25;0.3333;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#f97316;#dc2626;#c2410c;#c2410c;#f97316" keyTimes="0;0.25;0.3333;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="185" y="130" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1,2</text>

  <circle cx="185" cy="195" r="20" fill="#ffffff" stroke="#f97316" stroke-width="2">
    <animate attributeName="fill" values="#ffffff;#dc2626;#f97316;#f97316;#ffffff" keyTimes="0;0.3333;0.4167;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#f97316;#dc2626;#c2410c;#c2410c;#f97316" keyTimes="0;0.3333;0.4167;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="185" y="200" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2,2</text>

  <circle cx="115" cy="195" r="20" fill="#ffffff" stroke="#f97316" stroke-width="2">
    <animate attributeName="fill" values="#ffffff;#dc2626;#f97316;#f97316;#ffffff" keyTimes="0;0.4167;0.5;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#f97316;#dc2626;#c2410c;#c2410c;#f97316" keyTimes="0;0.4167;0.5;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="115" y="200" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2,1</text>

  <!-- goal: a distinct green, so it never gets mistaken for a regular visited (orange) node -->
  <circle cx="45" cy="195" r="20" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <text x="45" y="200" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2,0</text>
</svg>


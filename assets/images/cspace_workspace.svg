<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="20" y="24" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Workspace</text>

  <!-- Room boundary -->
  <rect x="20" y="35" width="260" height="250" fill="none" stroke="#334155" stroke-width="3"/>

  <!-- Obstacles, drawn to their actual physical size -->
  <polygon points="80,95 140,85 150,145 90,155" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <polygon points="150,155 210,145 220,205 160,215" fill="#94a3b8" stroke="#475569" stroke-width="2"/>

  <!-- Robot, drawn to its actual physical size -->
  <circle cx="50" cy="260" r="15" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>

  <!-- Goal -->
  <path d="M240,40 L244,50 L255,51 L247,58 L249,69 L240,63 L231,69 L233,58 L225,51 L236,50 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
</svg>

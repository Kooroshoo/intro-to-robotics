<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
  <defs>
    <marker id="dfsArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Every edge in the graph -->
  <g stroke="#334155" stroke-width="2">
    <line x1="135" y1="70" x2="95" y2="120"/>
    <line x1="165" y1="70" x2="200" y2="120"/>
    <line x1="73" y1="164" x2="62" y2="201"/>
    <line x1="96" y1="159" x2="137" y2="206"/>
    <line x1="226" y1="163" x2="244" y2="201"/>
    <line x1="178" y1="225" x2="230" y2="224"/>
  </g>

  <!-- DFS commits to one path as deep as it can go before backtracking -->
  <g stroke="#2563eb" stroke-width="2.5" opacity="0.75">
    <line x1="116" y1="73" x2="94" y2="101" marker-end="url(#dfsArrow)"/>
    <line x1="61" y1="160" x2="50" y2="195" marker-end="url(#dfsArrow)"/>
    <line x1="86" y1="217" x2="122" y2="217" marker-end="url(#dfsArrow)"/>
    <line x1="186" y1="217" x2="222" y2="216" marker-end="url(#dfsArrow)"/>
    <line x1="238" y1="160" x2="254" y2="192" marker-start="url(#dfsArrow)"/>
  </g>

  <!-- Nodes -->
  <circle cx="150" cy="50" r="22" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="150" y="56" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">A</text>

  <circle cx="80" cy="140" r="22" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="80" y="146" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">B</text>

  <circle cx="215" cy="140" r="22" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="215" y="146" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">C</text>

  <circle cx="55" cy="225" r="22" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="55" y="231" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">D</text>

  <circle cx="153" cy="225" r="22" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="153" y="231" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">E</text>

  <circle cx="255" cy="224" r="22" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="255" y="230" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">F</text>

  <text x="150" y="268" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#334155">LIFO</text>
</svg>

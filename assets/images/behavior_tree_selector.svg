<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" width="1080" height="360">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Connectors: root to its two children -->
  <line x1="450" y1="85" x2="230" y2="160" stroke="#334155" stroke-width="2"/>
  <line x1="450" y1="85" x2="670" y2="160" stroke="#334155" stroke-width="2"/>

  <!-- Connectors: "Get Peg" sequence to its four leaves -->
  <line x1="670" y1="215" x2="540" y2="270" stroke="#334155" stroke-width="2"/>
  <line x1="670" y1="215" x2="690" y2="270" stroke="#334155" stroke-width="2"/>
  <line x1="670" y1="215" x2="840" y2="270" stroke="#334155" stroke-width="2"/>
  <line x1="670" y1="215" x2="990" y2="270" stroke="#334155" stroke-width="2"/>

  <!-- Root: selector node -->
  <rect x="370" y="15" width="160" height="70" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="450" y="40" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">Pick Square</text>
  <text x="450" y="58" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">Peg</text>
  <text x="450" y="76" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e293b">?</text>

  <!-- Left child: leaf -->
  <rect x="150" y="160" width="160" height="80" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="230" y="188" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">Sense if peg</text>
  <text x="230" y="205" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">already in</text>
  <text x="230" y="222" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">gripper</text>

  <!-- Right child: sequence node -->
  <rect x="560" y="160" width="220" height="55" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="670" y="184" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">Get Peg</text>
  <text x="670" y="206" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#1e293b">&#8594;</text>

  <!-- Grandchildren: leaves under "Get Peg" -->
  <rect x="470" y="270" width="140" height="70" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="540" y="310" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">Locate Peg</text>

  <rect x="620" y="270" width="140" height="70" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="690" y="310" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">Open Gripper</text>

  <rect x="770" y="270" width="140" height="70" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="840" y="301" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">Move gripper</text>
  <text x="840" y="318" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">to peg</text>

  <rect x="920" y="270" width="140" height="70" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="990" y="310" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">Close gripper</text>
</svg>

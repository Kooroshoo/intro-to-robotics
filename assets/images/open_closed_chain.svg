<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="480" height="210">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Open chain -->
  <text x="20" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Open Chain</text>

  <g transform="translate(0,-20)">
  <line x1="40" y1="170" x2="80" y2="120" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="120" x2="140" y2="100" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="100" x2="190" y2="130" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <circle cx="40" cy="170" r="6" fill="#333"/>
  <circle cx="80" cy="120" r="6" fill="#333"/>
  <circle cx="140" cy="100" r="6" fill="#333"/>
  <circle cx="190" cy="130" r="6" fill="#0d9488"/>
  </g>

  <text x="20" y="185" font-family="sans-serif" font-size="12" fill="#64748b">DOF = sum of each joint's freedom</text>

  <!-- Closed chain -->
  <text x="260" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Closed Chain</text>

  <g transform="translate(0,-32)">
  <!-- Fixed base platform -->
  <line x1="270" y1="180" x2="390" y2="180" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <line x1="276" y1="180" x2="268" y2="190" stroke="#334155" stroke-width="2"/>
  <line x1="290" y1="180" x2="282" y2="190" stroke="#334155" stroke-width="2"/>
  <line x1="304" y1="180" x2="296" y2="190" stroke="#334155" stroke-width="2"/>
  <line x1="318" y1="180" x2="310" y2="190" stroke="#334155" stroke-width="2"/>
  <line x1="332" y1="180" x2="324" y2="190" stroke="#334155" stroke-width="2"/>
  <line x1="346" y1="180" x2="338" y2="190" stroke="#334155" stroke-width="2"/>
  <line x1="360" y1="180" x2="352" y2="190" stroke="#334155" stroke-width="2"/>
  <line x1="374" y1="180" x2="366" y2="190" stroke="#334155" stroke-width="2"/>

  <!-- Crossed struts: the classic Stewart-platform "scissor" silhouette -->
  <line x1="270" y1="180" x2="370" y2="100" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <line x1="390" y1="180" x2="300" y2="100" stroke="#334155" stroke-width="5" stroke-linecap="round"/>

  <circle cx="270" cy="180" r="6" fill="#333"/>
  <circle cx="390" cy="180" r="6" fill="#333"/>

  <!-- Moving platform: the mechanism's end-effector -->
  <line x1="300" y1="100" x2="370" y2="100" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="300" cy="100" r="6" fill="#16a34a"/>
  <circle cx="370" cy="100" r="6" fill="#16a34a"/>
  </g>

  <text x="260" y="185" font-family="sans-serif" font-size="12" fill="#64748b">DOF &lt; sum of joints — the loop constrains them</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="20" y="24" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Heading: 0&#176;</text>

  <!-- Room boundary -->
  <rect x="20" y="35" width="260" height="250" fill="none" stroke="#334155" stroke-width="3"/>

  <!-- Real obstacle -->
  <polygon points="80,95 140,85 150,145 90,155" fill="#94a3b8" stroke="#475569" stroke-width="2"/>

  <!-- Inflated boundary for this heading: wider along the robot's long axis -->
  <polygon points="45,84 165,70 185,156 65,170" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Robot, long axis horizontal -->
  <g transform="translate(50, 240)">
    <rect x="-25" y="-10" width="50" height="20" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <circle cx="0" cy="0" r="3" fill="#2563eb"/>
  </g>
</svg>

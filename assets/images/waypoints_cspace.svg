<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" height="100%">
  <defs>
    <marker id="wpArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333"/>
    </marker>
    <marker id="wpArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="wpArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- World axes -->
  <line x1="70" y1="350" x2="650" y2="350" stroke="#333" stroke-width="2" marker-end="url(#wpArrow)"/>
  <text x="658" y="355" font-family="sans-serif" font-size="15" fill="#333" font-style="italic">x</text>

  <line x1="70" y1="350" x2="70" y2="30" stroke="#333" stroke-width="2" marker-end="url(#wpArrow)"/>
  <text x="58" y="22" font-family="sans-serif" font-size="15" fill="#333" font-style="italic">y</text>

  <!-- The real obstacle -->
  <g transform="translate(325, 185) rotate(-25)">
    <rect x="-50" y="-35" width="100" height="70" rx="8" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
  </g>
  <text x="290" y="290" font-family="sans-serif" font-size="14" fill="#475569">obstacle</text>

  <!-- Inflated in configuration space: grown by the robot's own size -->
  <g transform="translate(325, 185) rotate(-25)">
    <rect x="-70" y="-55" width="140" height="110" rx="14" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  </g>

  <!-- Planned path: a sequence of waypoints around the inflated obstacle -->
  <line x1="150" y1="280" x2="220" y2="140" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="220" y1="140" x2="320" y2="30" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="320" y1="30" x2="430" y2="55" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="430" y1="55" x2="500" y2="90" stroke="#16a34a" stroke-width="2.5" marker-end="url(#wpArrowGreen)"/>

  <circle cx="220" cy="140" r="6" fill="#16a34a"/>
  <text x="196" y="130" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a">w&#8321;</text>

  <circle cx="320" cy="30" r="6" fill="#16a34a"/>
  <text x="326" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a">w&#8322;</text>

  <circle cx="430" cy="55" r="6" fill="#16a34a"/>
  <text x="436" y="47" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a">w&#8323;</text>

  <!-- Robot, now just a point, with heading toward w1 -->
  <circle cx="150" cy="280" r="6" fill="#334155"/>
  <line x1="150" y1="280" x2="168" y2="244" stroke="#dc2626" stroke-width="2" marker-end="url(#wpArrowRed)"/>

  <!-- Goal marker -->
  <path d="M500,62 L507.1,80.3 L526.6,81.4 L511.4,93.7 L516.5,112.7 L500,102 L483.5,112.7 L488.6,93.7 L473.4,81.4 L493,80.3 Z" fill="#f59e0b" stroke="#b45309" stroke-width="2" stroke-linejoin="round"/>
</svg>

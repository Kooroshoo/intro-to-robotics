<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260">
  <defs>
    <marker id="asdArrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="20" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155">Actuator-space DOF</text>
  <text x="20" y="50" font-family="sans-serif" font-size="13" fill="#64748b">2 DOF: &#966;_l, &#966;_r</text>

  <!-- Differential-drive robot, matching the rest of the book -->
  <g transform="translate(110, 145)">
    <rect x="-22" y="-28" width="44" height="8" rx="3" fill="#cbd5e1"/>
    <rect x="-22" y="20" width="44" height="8" rx="3" fill="#cbd5e1"/>
    <circle cx="0" cy="0" r="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="3" fill="#cbd5e1"/>

    <!-- Wheel 1 (top) rolling direction, phi_r -->
    <line x1="14" y1="-24" x2="-14" y2="-24" stroke="#2563eb" stroke-width="2.5" marker-end="url(#asdArrowBlue)"/>
    <text x="32" y="-20" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">&#966;_r</text>

    <!-- Wheel 2 (bottom) rolling direction, phi_l -->
    <line x1="14" y1="24" x2="-14" y2="24" stroke="#2563eb" stroke-width="2.5" marker-end="url(#asdArrowBlue)"/>
    <text x="32" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">&#966;_l</text>
  </g>
</svg>

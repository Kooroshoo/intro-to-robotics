site_name: Robotics Control Theory
site_description: A mathematical guide to robot kinematics and control.
site_author: Robotics Control Theory Contributors

theme:
  name: material
  # 1. Custom Typography: A book-like Serif for reading, clear code font
  font:
    text: Merriweather
    code: Fira Code
  # 2. Premium Features
  features:
    - navigation.sections
    - navigation.top
    - navigation.tabs # Moves top-level folders to a sleek top menu
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy # Adds a nice "copy" button to your Python code
    - content.code.annotate
    - content.tooltips
  # 3. Branding (We will use placeholders for now)
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom # We will define this in CSS
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# 4. Pointing to our new custom design file
extra_css:
  - stylesheets/extra.css

# 5. Math, Callout Boxes, and Readability Extensions
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Introduction: index.md
  - Spatial Representation: 02-spatial-representation.md
  - Differential Kinematics: 03-differential-kinematics.md